name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    name: Node ${{ matrix.node-version }}, React ${{ matrix.react-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        react-version: [18, 19]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Install React 19
        if: matrix.react-version == 19
        run: npm install --no-save react@19 react-dom@19

      - run: npm run build

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

      - run: npm run test

      - run: npm run check:package

      # Examples and docs live in sudo-ezekiel/react-observer-agent-examples and
      # are built there, against the published package.
