name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    name: Build, lint and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm run test

      # `npm run format:check` is deliberately not gated here: it fails on files
      # that predate this workflow. Add it once the tree is Prettier clean.

  example:
    name: Typecheck example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The example depends on the library via file:../../, so it reads dist/.
      - run: npm run build

      - run: npm ci
        working-directory: examples/basic

      - run: npx tsc --noEmit
        working-directory: examples/basic
