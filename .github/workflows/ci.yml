name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    name: Build, lint and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm run test

      # `npm run format:check` is deliberately not gated here: it fails on files
      # that predate this workflow. Add it once the tree is Prettier clean.

      # Examples and docs live in sudo-ezekiel/react-observer-agent-examples and
      # are built there, against the published package.
